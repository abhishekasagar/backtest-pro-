<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BacktestPro - Trading Strategy Backtester</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css">
</head>
<body>
  <div style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #0f172a; color: #e2e8f0; }
      
      .navbar { background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid rgba(100, 116, 139, 0.3); padding: 1.5rem 2rem; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
      .navbar-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
      .logo { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      
      .container { max-width: 1400px; margin: 0 auto; padding: 3rem 2rem; }
      
      .header-section { margin-bottom: 3rem; text-align: center; }
      .header-title { font-size: 42px; font-weight: 700; margin-bottom: 0.5rem; color: #f1f5f9; letter-spacing: -0.5px; }
      .header-subtitle { font-size: 18px; color: #94a3b8; margin-bottom: 2rem; }
      
      .setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
      
      .setup-card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(100, 116, 139, 0.3); border-radius: 12px; padding: 2rem; backdrop-filter: blur(10px); }
      .setup-label { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin-bottom: 0.75rem; font-weight: 600; }
      .setup-content { display: flex; flex-direction: column; gap: 0.75rem; }
      
      .button-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .btn-option { flex: 1; min-width: 140px; padding: 0.75rem 1rem; border: 1.5px solid rgba(100, 116, 139, 0.3); background: transparent; color: #cbd5e1; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
      .btn-option:hover { border-color: rgba(59, 130, 246, 0.5); background: rgba(59, 130, 246, 0.1); }
      .btn-option.active { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); border-color: transparent; color: white; }
      
      input, select, textarea { background: rgba(30, 41, 59, 0.8); border: 1.5px solid rgba(100, 116, 139, 0.3); color: #f1f5f9; padding: 0.75rem 1rem; border-radius: 8px; font-size: 14px; font-family: inherit; width: 100%; }
      input:focus, select:focus, textarea:focus { outline: none; border-color: #3b82f6; background: rgba(30, 41, 59, 0.95); }
      textarea { resize: vertical; min-height: 100px; font-family: 'Monaco', 'Courier New', monospace; }
      
      .run-button { width: 100%; padding: 1rem; background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 1rem; }
      .run-button:hover { transform: translateY(-2px); box-shadow: 0 20px 40px rgba(59, 130, 246, 0.3); }
      .run-button:active { transform: translateY(0); }
      
      .results-section { display: none; }
      .results-section.active { display: block; }
      
      .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
      .metric-card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(100, 116, 139, 0.3); border-radius: 12px; padding: 1.5rem; text-align: center; }
      .metric-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; margin-bottom: 0.75rem; font-weight: 600; }
      .metric-value { font-size: 28px; font-weight: 700; letter-spacing: -1px; }
      .metric-positive { background: linear-gradient(135deg, #10b981 0%, #059669 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      .metric-negative { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      .metric-neutral { color: #e2e8f0; }
      
      .chart-card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(100, 116, 139, 0.3); border-radius: 12px; padding: 2rem; margin-bottom: 2rem; }
      .chart-title { font-size: 18px; font-weight: 600; margin-bottom: 1.5rem; color: #f1f5f9; }
      
      .trades-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 1rem; }
      .trades-table thead { background: rgba(59, 130, 246, 0.1); }
      .trades-table th { padding: 1rem; text-align: left; color: #cbd5e1; font-weight: 600; border-bottom: 1px solid rgba(100, 116, 139, 0.3); }
      .trades-table td { padding: 0.75rem 1rem; border-bottom: 1px solid rgba(100, 116, 139, 0.2); }
      .trades-table tr:hover { background: rgba(59, 130, 246, 0.05); }
      .trade-win { color: #10b981; font-weight: 600; }
      .trade-loss { color: #ef4444; font-weight: 600; }
      
      .loading { display: none; text-align: center; padding: 3rem; }
      .loading.active { display: block; }
      .spinner { width: 40px; height: 40px; border: 3px solid rgba(100, 116, 139, 0.3); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loading-text { color: #94a3b8; font-size: 16px; }
      
      .error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
      .error.active { display: block; }
    </style>
    
    <div class="navbar">
      <div class="navbar-content">
        <div class="logo">⚡ BacktestPro</div>
        <div style="color: #94a3b8; font-size: 13px;">Professional Trading Strategy Backtester</div>
      </div>
    </div>
    
    <div class="container">
      <div class="header-section">
        <div class="header-title">Test Your Trading Strategy</div>
        <div class="header-subtitle">Get 5 years of backtested results on your pair. Free. Instantly.</div>
      </div>
      
      <div id="setupSection">
        <div class="setup-grid">
  <div class="setup-card">
    <div class="setup-label">Trading Pair/Index</div>
    <input type="text" id="symbol" placeholder="e.g., EURUSD, BTCUSD, SPY, GOLD, NQ100" value="" />
  </div>
</div>
        
        <div class="setup-card">
          <div class="setup-label">Describe Your Strategy</div>
          <textarea id="strategy" placeholder="Example: Buy when RSI is below 30, sell when RSI is above 70.

Or: Buy on breakout above 20-day high, sell on close below 20-day low.

Or: Buy when 20-day MA crosses above 50-day MA, sell on reverse."></textarea>
          <button class="run-button" onclick="runBacktest()">Run Backtest (5 Years)</button>
        </div>
      </div>
      
      <div id="errorContainer" class="error"></div>
      <div id="loadingContainer" class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Backtesting your strategy...</div>
      </div>
      
      <div id="resultsSection" class="results-section">
        <div style="margin-bottom: 1.5rem;">
          <button class="btn-option" onclick="resetBacktest()" style="width: 140px;">← New Strategy</button>
        </div>
        
        <div class="metrics-grid" id="metricsGrid"></div>
        
        <div class="chart-card">
          <div class="chart-title">Equity Curve (5 Years)</div>
          <div style="position: relative; width: 100%; height: 320px;">
            <canvas id="equityChart"></canvas>
          </div>
        </div>
        
        <div class="chart-card">
          <div class="chart-title">Trade History</div>
          <table class="trades-table" id="tradesTable"></table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="script.js"></script>
</body>
</html>
